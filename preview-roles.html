<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>三顆按鈕配色 · MYZOO 撿貨核對</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13151C">
<link rel="icon" href="data:,">
<style>
:root{
  --ground:#13151C; --surface:#1C1F29; --surface-2:#252936; --surface-3:#2E3342;
  --line:#343A4B; --line-soft:#282D3A;
  --ink:#EDEFF5; --ink-dim:#9AA2B5; --ink-faint:#6A7285;
  --amber:#FFB020; --amber-ink:#1A1204;
  --amber-wash:rgba(255,176,32,.13); --amber-line:rgba(255,176,32,.38);
  --ok:#3DD68C; --ok-ink:#04200F;
  --blue:#5B93F5; --blue-ink:#05122C;
  --blue-wash:rgba(91,147,245,.14); --blue-line:rgba(91,147,245,.42);
  --pad:16px;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:460px;margin:0 auto;padding:20px var(--pad) 50px}
h1{font-size:19px;font-weight:800;margin:0 0 4px}
.sub{color:var(--ink-dim);font-size:13px;line-height:1.7;margin:0 0 24px}
.sub b{color:var(--amber)}
.ico{width:1em;height:1em;fill:currentColor;display:block}

.block{margin-bottom:30px}
.tag{
  display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;
  color:var(--amber);background:var(--amber-wash);border:1px solid var(--amber-line);
  padding:3px 10px;border-radius:999px;margin-bottom:6px;
}
.name{font-size:15.5px;font-weight:750;margin:0 0 3px}
.why{color:var(--ink-faint);font-size:12.5px;line-height:1.65;margin:0 0 12px}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink-faint);
  margin:14px 0 9px;
}

.pick{
  width:100%;appearance:none;font:inherit;cursor:pointer;text-align:center;
  padding:24px 16px 20px;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;gap:9px;
}
.pick .ico{font-size:42px}
.pick b{font-size:21px;font-weight:800}
.pick span{font-size:12.5px;line-height:1.45;opacity:.75}

/* 甲：藍色實心 */
.p-blue{background:var(--blue);border:2px solid var(--blue);color:var(--blue-ink)}
/* 乙：深色底 ＋ 琥珀外框 */
.p-out{background:var(--surface);border:2px solid var(--amber-line);color:var(--amber)}
.p-out span{color:var(--ink-faint);opacity:1}
/* 丙：淺色實心 */
.p-light{background:var(--ink);border:2px solid var(--ink);color:#12141A}

.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
/* 三顆各有各的顏色：選檔案＝藍、撿貨＝琥珀、對單貼標＝綠。
   角色「沒被選中」時也保留自己的色（淡底＋彩色框），只有選中才整塊填滿。
   這樣三顆隨時都分得出來，選中的又格外突出。 */
.role{
  appearance:none;font:inherit;text-align:center;padding:20px 12px 16px;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.role .ico{font-size:36px}
.role b{font-size:20px;font-weight:800}
.role span{font-size:11.5px;line-height:1.45;opacity:.8}
.r-pick{background:var(--amber-wash);border:2px solid var(--amber-line);color:var(--amber)}
.r-pick span{color:var(--ink-faint);opacity:1}
.r-pick.sel{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.r-pick.sel span{color:var(--amber-ink);opacity:.72}
.r-lab{background:var(--ok-wash);border:2px solid var(--ok-line);color:var(--ok)}
.r-lab span{color:var(--ink-faint);opacity:1}
.r-lab.sel{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.r-lab.sel span{color:var(--ok-ink);opacity:.72}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-folder_open" viewBox="0 -960 960 960"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h240l80 80h320q33 0 56.5 23.5T880-640H447l-80-80H160v480l96-320h684L837-217q-8 26-29.5 41.5T760-160H160Zm84-80h516l72-240H316l-72 240Zm0 0 72-240-72 240Zm-84-400v-80 80Z"/></symbol>
<symbol id="i-package_2" viewBox="0 -960 960 960"><path d="M440-183v-274L200-596v274l240 139Zm80 0 240-139v-274L520-457v274Zm-80 92L160-252q-19-11-29.5-29T120-321v-318q0-22 10.5-40t29.5-29l280-161q19-11 40-11t40 11l280 161q19 11 29.5 29t10.5 40v318q0 22-10.5 40T800-252L520-91q-19 11-40 11t-40-11Zm200-528 77-44-237-137-78 45 238 136Zm-160 93 78-45-237-137-78 45 237 137Z"/></symbol>
<symbol id="i-fact_check" viewBox="0 -960 960 960"><path d="M160-120q-33 0-56.5-23.5T80-200v-560q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v560q0 33-23.5 56.5T800-120H160Zm0-80h640v-560H160v560Zm40-80h200v-80H200v80Zm382-80 198-198-57-57-141 142-57-57-56 57 113 113Zm-382-80h200v-80H200v80Zm0-160h200v-80H200v80Zm-40 400v-560 560Z"/></symbol>
</defs></svg>

<div class="wrap">
  <h1>三顆按鈕 · 配色示意</h1>
  <p class="sub">三顆各有各的顏色：<b>選檔案＝藍</b>、撿貨＝琥珀、對單貼標＝綠。<br>角色沒被選中時也保留自己的色（淡底），選中才整塊填滿。<br>下面三組只差在<b>最上面那顆的配色</b>。</p>

  <div class="block">
    <span class="tag">甲</span>
    <p class="name">藍色實心</p>
    <p class="why">給「動作」一個獨立的顏色，跟「模式」的琥珀／綠完全分開。層次最清楚。</p>
    <button class="pick p-blue">
      <svg class="ico"><use href="#i-folder_open"/></svg>
      <b>選擇出貨明細</b><span>今天的 xlsx 原檔，不用先整理</span>
    </button>
    <div class="eyebrow">你現在做哪一段</div>
    <div class="rolegrid">
      <button class="role r-pick sel"><svg class="ico"><use href="#i-package_2"/></svg><b>撿貨</b><span>撿齊、分成一堆一堆</span></button>
      <button class="role r-lab"><svg class="ico"><use href="#i-fact_check"/></svg><b>對單貼標</b><span>覆核一堆、貼物流標</span></button>
    </div>
  </div>

  <div class="block">
    <span class="tag">乙</span>
    <p class="name">深色底 ＋ 琥珀外框</p>
    <p class="why">最低調，讓下面角色的顏色主導畫面。缺點是沒那麼吸睛，新人可能不知道要先按這裡。</p>
    <button class="pick p-out">
      <svg class="ico"><use href="#i-folder_open"/></svg>
      <b>選擇出貨明細</b><span>今天的 xlsx 原檔，不用先整理</span>
    </button>
    <div class="eyebrow">你現在做哪一段</div>
    <div class="rolegrid">
      <button class="role r-pick sel"><svg class="ico"><use href="#i-package_2"/></svg><b>撿貨</b><span>撿齊、分成一堆一堆</span></button>
      <button class="role r-lab"><svg class="ico"><use href="#i-fact_check"/></svg><b>對單貼標</b><span>覆核一堆、貼物流標</span></button>
    </div>
  </div>

  <div class="block">
    <span class="tag">丙</span>
    <p class="name">白色實心</p>
    <p class="why">對比最強，倉庫光線差也一定看得到。但白色面積大，暗環境下可能刺眼。</p>
    <button class="pick p-light">
      <svg class="ico"><use href="#i-folder_open"/></svg>
      <b>選擇出貨明細</b><span>今天的 xlsx 原檔，不用先整理</span>
    </button>
    <div class="eyebrow">你現在做哪一段</div>
    <div class="rolegrid">
      <button class="role r-pick sel"><svg class="ico"><use href="#i-package_2"/></svg><b>撿貨</b><span>撿齊、分成一堆一堆</span></button>
      <button class="role r-lab"><svg class="ico"><use href="#i-fact_check"/></svg><b>對單貼標</b><span>覆核一堆、貼物流標</span></button>
    </div>
  </div>

</div>
</body>
</html>
